name: SEO validation and image optimization
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/seo_quality.py'
      - 'assets/**'
      - 'wp-content/uploads/**'
      - 'llms.txt'
      - 'vercel.json'
      - '.github/workflows/seo-quality.yml'
  pull_request:
permissions:
  contents: read
concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/seo_quality.py --optimize
      - name: Save optimized static assets
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' assets wp-content/uploads scripts/optimized-images.json
          if ! git diff --cached --quiet; then
            git commit -m "Optimize image payloads and complete intrinsic image dimensions"
            git push origin HEAD:main
          fi
