name: Verify published SEO fixes
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_live.py
